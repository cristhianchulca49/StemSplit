# ==========================================
# DATABASE CONFIGURATION (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/musicai_db
spring.datasource.username=musicuser
spring.datasource.password=musicpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# MESSAGING CONFIGURATION (RabbitMQ)
# ==========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.exchange=audio.processing.exchange
app.rabbitmq.queue=audio.processing.queue
app.rabbitmq.routing-key=audio.processing.routingkey

# ==========================================
# FILE UPLOAD CONFIGURATION (Issue 1.5)
# ==========================================
# Max file size allowed (15MB limit)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Custom property for local storage path
storage.local.default-dir=./uploads

