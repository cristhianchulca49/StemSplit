# ==========================================
# DATABASE CONFIGURATION (H2 para Tests)
# ==========================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Desactivar autoconfiguración de RabbitMQ en tests si no usas un Mock
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfigurationc