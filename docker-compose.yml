services:
  postgres:
    image: postgres:15-alpine
    container_name: musicai-postgres
    environment:
      POSTGRES_USER: musicuser
      POSTGRES_PASSWORD: musicpassword
      POSTGRES_DB: musicai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: musicai-rabbitmq
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management Console UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: always

volumes:
  postgres_data: